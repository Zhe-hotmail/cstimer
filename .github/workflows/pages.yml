name: Deploy to Github Pages

on:
  push:
    branches: ["master"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup java
        uses: actions/setup-java@v4.0.0
        with: 
          distribution: 'temurin'
          java-version: '11'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Training regressions
        run: node npm_export/testbench/training-test.js
      - name: Build cstimer
        run: node experiment/build-static.js
      - name: Check static output
        run: node npm_export/testbench/static-test.js
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/local'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
